[workspace]
name = "molla"
version = "0.2.6"
description = "Local inference server in pure Mojo"
authors = ["tamnd <1218621+tamnd@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
# Pinned to an exact version on purpose. A toolchain change is a deliberate
# commit with a green CI run behind it, not something that happens on a Tuesday
# because someone ran an update. See docs/validation/toolchain.md.
mojo = "==1.0.0"
# The runtime max/kernels calls into, and the only sanctioned route to a device
# buffer, since D1 keeps FFI to libc and the platform TLS library. It is
# proprietary and it is required to run molla, not only to build it. That is a
# real cost and it is named in the README rather than buried here. The decision,
# with the alternative that was rejected, is in docs/adr/0002-accept-max-core.md.
max-core = "==26.5.0"

[tasks]
mkbuild = { cmd = "mkdir -p build" }
build = { cmd = "mojo build -I src src/molla/main.mojo -o build/molla", depends-on = [
    "mkbuild",
] }
run = "mojo run -I src src/molla/main.mojo"
# Mojo 1.0 has no test command, so the suite is a binary that exits nonzero on
# failure. See tests/harness.mojo.
test = "mojo run -I src -I tests tests/main.mojo"
fmt = "mojo format -q src tests scripts"
# `mojo format` has no check mode, so formatting in place and asserting a clean
# tree is the honest equivalent. CI runs this on a clean checkout.
fmt-check = "mojo format -q src tests scripts && git diff --exit-code -- src tests scripts"
# What we paste into docs/validation/toolchain.md when adding a machine.
toolchain = "mojo --version"
check = { depends-on = ["fmt-check", "build", "test"] }
# The tokenizer conformance corpus. The files it reads are not in the
# repository, so `scripts/fetch-tokenizers.py` has to have put them in
# `corpus/tokenizers` first. The quick tier is what CI runs on every commit and
# the full one is a few hundred more files. See docs/validation/tokenizer.md.
conformance-tokenizer = "mojo run -I src scripts/tokenizer_oracle.mojo scripts/tokenizer_cases.txt scripts/tokenizers.tsv corpus/tokenizers quick"
conformance-tokenizer-full = "mojo run -I src scripts/tokenizer_oracle.mojo scripts/tokenizer_cases.txt scripts/tokenizers.tsv corpus/tokenizers full"
# The chat template conformance corpus, which works the same way and wants
# `scripts/fetch-templates.py` to have run first. The zone is pinned because a
# Llama template writes today's date into the system prompt, and both halves of
# the corpus have to read the same clock in the same zone. The full tier is
# every repository and takes half a second, so it is what CI runs; the quick
# tier is one repository per distinct template and is for iterating locally.
# See docs/validation/jinja.md.
conformance-template = { cmd = "mojo run -I src scripts/template_oracle.mojo scripts/template_cases.txt scripts/templates.tsv corpus/templates quick", env = { TZ = "UTC" } }
conformance-template-full = { cmd = "mojo run -I src scripts/template_oracle.mojo scripts/template_cases.txt scripts/templates.tsv corpus/templates full", env = { TZ = "UTC" } }
