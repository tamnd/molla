name: Release

# Releases are source only, and that is a licensing constraint rather than a
# packaging one.
#
# A Mojo 1.0 binary is not self contained. It links libKGENCompilerRTShared
# plus libMSupportGlobals and libAsyncRTRuntimeGlobals, those ship only as
# shared objects with no static archive anywhere in the toolchain, and they
# come from the mojo-compiler conda package under LicenseRef-Modular-
# Proprietary. On top of that the linker bakes RUNPATH to whatever pixi
# directory did the build, so the bare binary does not start on any other
# machine. Copying a Linux build to another box gives "cannot open shared
# object file: libKGENCompilerRTShared.so".
#
# Shipping a working tarball would therefore mean redistributing Modular's
# proprietary runtime inside molla's own release artifacts, which contradicts
# the fourth commitment in the README. So this workflow proves the tag builds
# and passes on all three platforms, publishes an SBOM and a signature, and
# publishes no binaries. See the known issue in CHANGELOG.md.
#
# When that changes, whether because the runtime becomes redistributable or
# because D1 moves the network edge, the binary and container jobs come back.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # A manual dispatch names the tag, a tag push already is one.
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@194d461b21b6c5717c722ffc597fa91ed2ff29fa # v0.9.1
        with:
          cache: true
      # No --release flag exists. mojo build already defaults to -O3, and
      # passing --release is an unrecognized argument error.
      - name: Build
        run: pixi run build
      - name: Test
        run: pixi run test
      - name: Smoke test the binary
        run: ./build/molla version

  publish:
    name: Publish release
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write  # create the release
      id-token: write  # keyless signing
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      # sbom-action writes to the path it is given and does not create it.
      - name: Prepare dist
        run: mkdir -p dist
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/molla.spdx.json
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the SBOM
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature dist/molla.spdx.json.sig \
            --output-certificate dist/molla.spdx.json.pem \
            dist/molla.spdx.json
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
