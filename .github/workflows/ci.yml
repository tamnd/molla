name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Least privilege by default. Jobs opt into more where they need it.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The toolchain version lives in pixi.toml and nowhere else. Two places to bump
# is one place to forget. See docs/validation/toolchain.md.

jobs:
  docs:
    name: Docs and links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Version is in step
        run: ./scripts/check-version.sh
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20
        with:
          globs: "**/*.md"
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: "--no-progress --max-concurrency 4 --accept 200,206,429 ."
          fail: true

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Catches unpinned actions, credential persistence, and template injection.
      - uses: zizmorcore/zizmor-action@e673c3917a1aef3c65c972347ed84ccd013ecda4 # v0.2.0
      # zizmor accepts any 40 character hex string, so it cannot tell a commit
      # from an annotated tag object. This can.
      - name: Action pins are commits
        run: ./scripts/check-action-pins.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shell:
    name: Shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shopt -s nullglob globstar
          files=(scripts/**/*.sh **/*.bash)
          if [ ${#files[@]} -eq 0 ]; then echo "no shell scripts yet"; exit 0; fi
          shellcheck "${files[@]}"

  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-aarch64
            runner: macos-15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@194d461b21b6c5717c722ffc597fa91ed2ff29fa # v0.9.1
        with:
          cache: true
          # Fail rather than silently resolving something new. The lock file is
          # committed so every runner gets the same toolchain.
          locked: true
      - name: Toolchain
        run: pixi run toolchain
      # `mojo format` has no check mode, so we format and assert the tree is
      # still clean. Only on Linux x86, since formatting is platform independent
      # and running it three times just gives three chances to be flaky.
      - name: Formatting
        if: matrix.name == 'linux-x86_64'
        run: pixi run fmt-check
      - name: Build
        run: pixi run build
      - name: Test
        run: pixi run test
      # The build is worthless if the binary does not start. Cheap to check.
      - name: Smoke test the binary
        shell: bash
        run: |
          ./build/molla version
          ./build/molla help
          if ./build/molla definitely-not-a-command 2>/dev/null; then
            echo "an unknown command should exit nonzero"
            exit 1
          fi
      # The suite runs a small version of this. The command runs a bigger one,
      # on every commit and on every platform, so that a change which puts an
      # allocation back on the request path fails in the pull request that made
      # it rather than in a benchmark six weeks later. See issue #17 and
      # docs/validation/allocations.md.
      - name: Allocation assertion
        run: ./build/molla allocs 16 4

  # Every id molla produces for a real tokenizer file, checked against the
  # digest the Hugging Face library gave for the same file and the same text.
  # The files are not in the repository, so they are fetched and cached. See
  # docs/validation/tokenizer.md and issue #22.
  tokenizer:
    name: Tokenizer conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@194d461b21b6c5717c722ffc597fa91ed2ff29fa # v0.9.1
        with:
          cache: true
          locked: true
      # Keyed on the manifest, so a corpus change fetches and everything else
      # restores. The prefix key means a change to one row does not re-download
      # the other fifty eight.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus/tokenizers
          key: tokenizers-quick-${{ hashFiles('scripts/tokenizers.tsv') }}
          restore-keys: tokenizers-quick-
      - name: Fetch the corpus
        run: python3 scripts/fetch-tokenizers.py --tier quick --into corpus/tokenizers
      - name: Run the corpus
        run: pixi run conformance-tokenizer

  # Numerics and performance need real devices, so they run on the fleet
  # rather than on hosted runners. See D7 and D8 in docs/design.md.
  # Gated on the label so forks and doc changes do not queue on hardware.
  hardware:
    name: Hardware suite (${{ matrix.device }})
    # Quoted because the label name contains a colon and space, which would
    # otherwise end the YAML scalar right here.
    if: "github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'needs: hardware')"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: apple-gpu
            runner: [self-hosted, macos, arm64, metal]
          - device: nvidia-sm89
            runner: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The numerics and bench tasks arrive with the kernel work in M0 and M2.
      # Until they exist this job proves the fleet runner can build, which is
      # the thing most likely to be quietly broken when we come to need it.
      - name: Check for hardware tasks
        id: tasks
        shell: bash
        run: |
          if pixi task list 2>/dev/null | grep -q 'test-numerics'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No hardware tasks defined yet, building only."
          fi
      - name: Build
        run: pixi run build
      - name: Numerics
        if: steps.tasks.outputs.present == 'true'
        run: pixi run test-numerics
      - name: Benchmarks
        if: steps.tasks.outputs.present == 'true'
        run: pixi run bench --json build/bench.json
      - name: Upload benchmark results
        if: steps.tasks.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-${{ matrix.device }}
          path: build/bench.json
          if-no-files-found: ignore

  # Single required check, so branch protection needs one entry and the
  # matrix can change without editing repo settings.
  ci-ok:
    name: CI OK
    if: always()
    needs: [docs, workflows, shell, build, tokenizer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any dependency failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "at least one required job did not pass"
            exit 1
          fi
          echo "all required jobs passed"
